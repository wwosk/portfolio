
# ==========================================
# JWT config
# ==========================================

app.jwt.secret=HERE_INSERT_RANDOM_SECURE_256b_KEY
app.jwt.expiration-ms=86400000

# ==========================================
# APPLICATION
# ==========================================
spring.application.name=mypaintings

# ==========================================
# DATASOURCE (H2 files-based)
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/mypaintingsdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


#==========================================
# H2 CONSOLE
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# LOGGING
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=trace

# ==========================================
# CUSTOM APP PROPERTIES
# ==========================================
app.upload.path=C:/Users/wawrz/IdeaProjects/mypaintings/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.base-url=http://localhost:8080

app.sale.vat-rate=0.23
app.sale.commission-rate=0.10
app.sale.shipping-cost=20.00

app.sale.max-active-locks-per-ip=3
app.sale.lock-expire-seconds=300
app.geolocation.search-radius=800.0
app.officialThreshold=5
